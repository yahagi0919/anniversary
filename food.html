    <script>
        // スクロール（スワイプ）で画像が画面に入ったら、ふわっと表示する
        (function () {
            var images = document.querySelectorAll('.gallery img');

            // 古い環境などで IntersectionObserver が使えない場合は、そのまま全部表示
            if (!('IntersectionObserver' in window)) {
                images.forEach(function (img) { img.classList.add('is-visible'); });
                return;
            }

            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (!entry.isIntersecting) return;
                    var img = entry.target;

                    // 画像の読み込みが終わってから表示すると、より滑らか
                    function show() { img.classList.add('is-visible'); }
                    if (img.complete) { show(); } else { img.addEventListener('load', show, { once: true }); }

                    observer.unobserve(img); // 1回だけ表示（戻ってもまた消えない）
                });
            }, {
                threshold: 0.12,                 // 画像の12%が見えたら発動
                rootMargin: '0px 0px -6% 0px'    // 画面の下端より少し手前で発動
            });

            images.forEach(function (img) { observer.observe(img); });
        })();
    </script>
